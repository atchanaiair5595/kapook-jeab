<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กระปุกเจี๊ยบ</title>
<meta name="theme-color" content="#FFD65C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column — yellow header band, cream page, rounded white cards, fixed pill tab bar with a raised + button */
:root{
  --bg:#FFF6DE; --band:#FFD65C; --card:#FFFFFF; --soft:#FFF0C4; --line:#F0DDA8;
  --ink:#5B2F1F; --muted:#957559; --accent:#FFC83A; --accent-ink:#4A2414;
  --good:#4E9A4A; --good-soft:#E2F2DD; --bad:#D04B45; --bad-soft:#FBE1DD;
  --sky:#4FA9DF; --sky-soft:#DCEFFB; --pink:#EE86B0; --lav:#A88BDC;
  --shadow:0 1px 0 rgba(91,47,31,.05),0 8px 20px rgba(190,140,30,.12);
  --f-display:'Mali','IBM Plex Sans Thai Looped','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai Looped','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1913; --band:#5A4513; --card:#2A231B; --soft:#362C1F; --line:#4A3D2A;
  --ink:#F7E9D2; --muted:#BDA787; --accent:#F2C24A; --accent-ink:#2B1A0D;
  --good:#8BCB83; --good-soft:#26361F; --bad:#F08A80; --bad-soft:#3E2420;
  --sky:#86C8F0; --sky-soft:#1F3341; --pink:#F2A2C3; --lav:#C3ACEC;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1913; --band:#5A4513; --card:#2A231B; --soft:#362C1F; --line:#4A3D2A;
  --ink:#F7E9D2; --muted:#BDA787; --accent:#F2C24A; --accent-ink:#2B1A0D;
  --good:#8BCB83; --good-soft:#26361F; --bad:#F08A80; --bad-soft:#3E2420;
  --sky:#86C8F0; --sky-soft:#1F3341; --pink:#F2A2C3; --lav:#C3ACEC;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}

/* header band */
.top{background:var(--band);border-radius:0 0 34px 34px;padding-block:14px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.back{width:42px;height:42px;border-radius:50%;border:0;background:rgba(91,47,31,.12);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:22px;height:22px}
.top h1{font-size:clamp(24px,7vw,32px);font-weight:700;flex:1;min-width:0;color:var(--ink)}
.sync{color:inherit;text-decoration:none;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.55);white-space:nowrap}
:root[data-theme="dark"] .sync{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sync{background:rgba(0,0,0,.25)}}
.chick{width:58px;height:58px;flex:none}
.sub{color:var(--ink);opacity:.8;font-size:14px;min-width:0}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin-top:-18px;display:flex;flex-direction:column;gap:14px;position:relative}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .grow{flex:1}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums;word-break:break-word}
.stat span{font-size:12px;color:var(--muted)}
.in{color:var(--good)} .out{color:var(--bad)}

/* buttons & inputs */
.btn{border:0;border-radius:99px;padding:10px 16px;background:var(--soft);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.full{width:100%}
.btn:focus-visible,.chip:focus-visible,.slot:focus-visible,.tile:focus-visible,.cat:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;min-height:44px;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.seg.money button.on.o{background:var(--bad-soft);color:var(--bad)}
.seg.money button.on.i{background:var(--good-soft);color:var(--good)}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.sky{background:var(--sky-soft);color:var(--sky)}

/* list */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px dashed var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.ic{width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:21px;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead{font-size:13px;color:var(--muted);margin:10px 0 0;font-weight:500}

/* bubbles */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:6px 0}
.bub{border-radius:50%;display:grid;place-items:center;text-align:center;line-height:1.15;font-size:12px;padding:4px}
.bub i{font-style:normal;font-size:1.35em;display:block}
.bub b{font-variant-numeric:tabular-nums;font-size:12px}

/* category grid */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1.5px solid transparent;background:var(--soft);border-radius:16px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;line-height:1.2;min-height:70px}
.cat i{font-style:normal;font-size:24px}
.cat.on{border-color:var(--accent);background:var(--card);box-shadow:var(--shadow);font-weight:600}

/* savings grid */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.slot{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px dashed var(--line);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;position:relative;color:var(--muted);font-variant-numeric:tabular-nums;padding:0}
.slot.on{background:var(--sky-soft);border:2px solid var(--sky);color:var(--sky)}
.slot.on::before,.slot.on::after{content:"";position:absolute;left:14%;right:14%;top:50%;height:5px;border-radius:5px;background:var(--pink);transform:rotate(45deg);opacity:.92}
.slot.on::after{transform:rotate(-45deg)}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--sky);border-radius:99px}
.bar.y>span{background:var(--accent)} .bar.p>span{background:var(--pink)} .bar.g>span{background:var(--good)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:0;border-radius:18px;padding:14px 6px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-decoration:none;color:inherit;font-size:13px;text-align:center;line-height:1.25}
.tile i{font-style:normal;font-size:30px}
.tile.soon{opacity:.55;cursor:default;box-shadow:none;background:var(--soft)}
.tile small{color:var(--muted);font-size:11px}

/* calculator results */
.opt{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.opt.best{border-color:var(--good);background:var(--good-soft)}
.res{border-radius:16px;padding:12px;background:var(--soft)}
.res.warn{background:var(--bad-soft)}
.big{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}

/* people */
.person{display:flex;flex-direction:column;gap:10px}
.owe{font-family:var(--f-display);font-size:24px;font-weight:700}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:16px;padding:14px;font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0;user-select:text;-webkit-user-select:text;word-break:break-word}
.entry{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line)}
.entry:first-child{border-top:0}
.entry .t{flex:1;min-width:0}
.entry input[type=checkbox]{width:22px;height:22px;accent-color:var(--good);flex:none}
.x{border:0;background:var(--bad-soft);color:var(--bad);border-radius:50%;width:30px;height:30px;cursor:pointer;flex:none}
.slip{max-width:100%;border-radius:14px;border:1.5px solid var(--line)}

/* gauge */
.gauge{display:flex;align-items:center;gap:16px}
.gauge svg{width:120px;height:120px;flex:none}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
.tabbar .in-bar{max-width:540px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 -2px 18px rgba(120,80,20,.14);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px;pointer-events:auto}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 0;text-decoration:none}
.tab i{font-style:normal;font-size:22px;filter:grayscale(.5);opacity:.85}
.tab.on{color:var(--ink);font-weight:600}
.tab.on i{filter:none;opacity:1}
.tab.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--accent);margin-top:2px}
.plus{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:5px solid var(--card);font-size:32px;font-weight:600;margin:-28px auto 0;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px rgba(200,140,20,.35);line-height:1}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(40,22,10,.42)}
.panel{position:relative;background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 2px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h3{font-size:22px;flex:1}
.close{border:0;background:var(--soft);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.note{background:var(--sky-soft);border-radius:14px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--bad-soft)}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.empty i{font-style:normal;font-size:34px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 2px;border-top:1px dashed var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
details summary{cursor:pointer;font-weight:500}
@media (max-width:380px){.cats{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <button class="back" id="backBtn" data-act="back" aria-label="กลับ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="title">กระปุกเจี๊ยบ</h1>
      <svg class="chick" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="58" rx="16" ry="3" fill="rgba(91,47,31,.15)"/><path d="M31 9c2-5 7-6 8-3-3 0-5 2-5 4" fill="#F3A33A"/><circle cx="32" cy="34" r="22" fill="#FFF3B0" stroke="#5B2F1F" stroke-width="2.4"/><path d="M14 38c-5 1-7 6-5 9 4-1 6-4 7-7" fill="#FFE57A" stroke="#5B2F1F" stroke-width="2"/><path d="M50 38c5 1 7 6 5 9-4-1-6-4-7-7" fill="#FFE57A" stroke="#5B2F1F" stroke-width="2"/><circle cx="24.5" cy="31" r="2.8" fill="#5B2F1F"/><circle cx="39.5" cy="31" r="2.8" fill="#5B2F1F"/><circle cx="25.5" cy="30" r=".9" fill="#fff"/><circle cx="40.5" cy="30" r=".9" fill="#fff"/><path d="M28 36l4 4 4-4z" fill="#F38A2E" stroke="#5B2F1F" stroke-width="1.6" stroke-linejoin="round"/><circle cx="19" cy="37" r="3" fill="#F7A6B8" opacity=".8"/><circle cx="45" cy="37" r="3" fill="#F7A6B8" opacity=".8"/></svg>
    </div>
    <div class="sub-row"><div class="sub" id="subtitle"></div><a class="sync" id="sync" href="#gsheet">กำลังเปิด…</a></div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabbar" aria-label="เมนูหลัก">
  <div class="in-bar">
    <a class="tab" href="#home" data-tab="home"><i>🏠</i>หน้าแรก</a>
    <a class="tab" href="#ledger" data-tab="ledger"><i>📒</i>บัญชี</a>
    <div><button class="plus" data-act="addTx" aria-label="เพิ่มรายการ">+</button></div>
    <a class="tab" href="#people" data-tab="people"><i>🤝</i>จ่ายเงินคน</a>
    <a class="tab" href="#menu" data-tab="menu"><i>🧺</i>เมนู</a>
  </div>
</nav>

<div id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody" class="stack"></div></div></div>
<div id="toast" hidden></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const fmt=(n,d=2)=>(Math.round((+n||0)*100)/100).toLocaleString('th-TH',{maximumFractionDigits:d});
const baht=n=>fmt(n)+' บาท';
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const ymOf=s=>s.slice(0,7);
const dTH=s=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);return `${d} ${TH_M[m-1]} ${String(y+543).slice(-2)}`};
const dTHnoY=s=>{const[,m,d]=s.split('-').map(Number);return `${d} ${TH_M[m-1]}`};
const mTH=ym=>{const[y,m]=ym.split('-').map(Number);return `${TH_MF[m-1]} ${y+543}`};
const shiftYM=(ym,k)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const lastDay=ym=>{const[y,m]=ym.split('-').map(Number);return ym+'-'+pad(new Date(y,m,0).getDate())};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}

const CATS={
 out:[['food','อาหาร','🍚'],['market','กับข้าว/ตลาด','🥬'],['drink','เครื่องดื่ม/กาแฟ','🧋'],['fuel','น้ำมันรถ','⛽'],['travel','ค่าเดินทาง','🚌'],['home','ของใช้ในบ้าน','🧺'],['util','ค่าน้ำไฟ','💡'],['phone','โทรศัพท์/เน็ต','📱'],['edu','การศึกษา','🎒'],['kids','ค่าขนมลูก','🍬'],['wage','ค่าแรง','👷'],['tools','อุปกรณ์/อะไหล่งาน','🧰'],['pets','สัตว์เลี้ยง/สวน','🐢'],['health','สุขภาพ','💊'],['debt','ผ่อน/ใช้หนี้','📆'],['repay','คืนเงินที่ยืม','🤝'],['save','เงินออม','🐷'],['fun','กินนอกบ้าน/เที่ยว','🎡'],['other','อื่นๆ','📦']],

const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('kapook-jeab',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs');if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  st(n,m){return IDB.db.transaction(n,m).objectStore(n)},
  all(n){return new Promise((res,rej)=>{const out={};const c=IDB.st(n,'readonly').openCursor();c.onsuccess=()=>{const k=c.result;if(k){out[k.key]=k.value;k.continue()}else res(out)};c.onerror=()=>rej(c.error)})},
  keys(n){return new Promise((res,rej)=>{const r=IDB.st(n,'readonly').getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  get(n,key){return new Promise((res,rej)=>{const r=IDB.st(n,'readonly').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},

const ERRTH={
  bad_key:'รหัสลับไม่ตรงกับใน Google Sheet ลองคัดลอกใหม่จากเมนู 🐣 กระปุกเจี๊ยบ ในชีต',

  network:'ติดต่อ Google ไม่ได้ ตรวจเน็ต หรือดูว่าลิงก์ถูกต้อง',
  server:'Google Sheet ตอบกลับผิดพลาด ลองใหม่อีกครั้ง'
};
const errText=e=>ERRTH[e&&e.message]||ERRTH.network;
async function api(body,conn){
  conn=conn||META.conn;
  let r;
  try{r=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,{key:conn.key})),redirect:'follow'})}
  catch(e){throw new Error('network')}
  const txt=await r.text();let j;
  try{j=JSON.parse(txt)}catch(e){throw new Error('not_json')}
  if(!j.ok)throw new Error(j.error||'server');
  return j;
}
const catNames=()=>{const o={};for(const k in CAT)o[k]=CAT[k].n;return o};
let syncTimer=null;
function schedSync(ms){if(!META.conn)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),ms??2500)}
async function syncNow(opts={}){
  if(!META.conn||S.syncing)return false;
  if(!navigator.onLine){setSync();return false}
  S.syncing=true;setSync();let ok=false;
  try{
    const push=Object.keys(META.outbox).filter(id=>S.docs[id]).map(id=>({id,u:S.docs[id]._u||Date.now(),data:JSON.stringify(S.docs[id])}));
    const sent={};push.forEach(p=>sent[p.id]=p.u);
    const res=await api({action:'sync',since:opts.full?0:META.since,push,cats:catNames()});
    for(const id of res.accepted||[])if(!S.docs[id]||S.docs[id]._u===sent[id])delete META.outbox[id];
    for(const id of Object.keys(META.outbox))if(!S.docs[id])delete META.outbox[id];
    let changed=false;
    for(const d of res.docs||[]){
      const local=S.docs[d.id];
      if(META.outbox[d.id]&&local&&(local._u||0)>=d.u)continue;
      let body;try{body=JSON.parse(d.data)}catch(e){continue}
      delete META.outbox[d.id];
      if(local&&JSON.stringify(local)===d.data)continue;
      S.docs[d.id]=body;persist(d.id);changed=true;
    }
    META.since=res.now;META.last=Date.now();META.lastErr='';saveMeta();ok=true;
    if(changed)softRender();
    await uploadSlips();
  }catch(e){META.lastErr=errText(e);saveMeta()}
  finally{S.syncing=false;setSync();if(route()==='gsheet')softRender()}
  if(ok&&pendingCount())schedSync(1500);
  return ok;
}
/* slip photos: kept on the phone, copied to the Google Drive folder when online */
async function uploadSlips(){
  if(!S.idb||!META.conn)return;
  const sl=D('slips');sl.map=sl.map||{};
  let keys=[];try{keys=await IDB.keys('blobs')}catch(e){return}
  for(const id of keys){
    if(sl.map[id])continue;
    const b=await IDB.get('blobs',id);if(!b)continue;
    const b64=(await blobToDataURL(b)).split(',')[1];
    try{const r=await api({action:'slip',id,mime:b.type||'image/jpeg',b64});sl.map[id]={fid:r.fid,url:r.url};save('slips')}
    catch(e){break}
  }
}
async function initStore(){
  try{
    await IDB.open();S.idb=true;
    const d=await IDB.all('docs');
    if(Object.keys(d).length)S.docs=d;
    else{let old={};try{old=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){}if(Object.keys(old).length){S.docs=old;Object.keys(old).forEach(save)}}
  }catch(e){S.idb=false;try{S.docs=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e2){S.docs={}}}
  try{if(navigator.storage&&navigator.storage.persist){S.persisted=await navigator.storage.persisted();if(!S.persisted)S.persisted=await navigator.storage.persist()}}catch(e){}
  S.mode='ready';setSync();render();schedSync(300);
}
const BLOBURL={};
async function slipURL(id){
  if(BLOBURL[id])return BLOBURL[id];
  try{const b=S.idb?await IDB.get('blobs',id):null;if(b){BLOBURL[id]=URL.createObjectURL(b);return BLOBURL[id]}}catch(e){}
  const m=(S.docs.slips&&S.docs.slips.map||{})[id];
  return m&&m.fid?`https://drive.google.com/thumbnail?id=${encodeURIComponent(m.fid)}&sz=w1200`:'';
}
function hydrateSlips(root){(root||document).querySelectorAll('img[data-slip]').forEach(async im=>{
  const id=im.dataset.slip;const u=await slipURL(id);const m=(S.docs.slips&&S.docs.slips.map||{})[id];
  const fallback=()=>{if(m&&m.url){const a=document.createElement('a');a.href=m.url;a.target='_blank';a.rel='noopener';a.className='btn ghost';a.textContent='เปิดรูปสลิปใน Google Drive';im.replaceWith(a)}else im.alt='ไม่พบรูปในเครื่องนี้'};
  if(u){im.onerror=fallback;im.src=u}else fallback();
})}

function allTx(){return Object.keys(S.docs).filter(k=>k.startsWith('tx-')).flatMap(k=>S.docs[k].items||[])}
function addTx(t){const d=D('tx-'+ymOf(t.date));t.id=t.id||uid();d.items.push(t);save('tx-'+ymOf(t.date));return t}
function delTx(id){for(const k of Object.keys(S.docs))if(k.startsWith('tx-')){const it=S.docs[k].items||[];const i=it.findIndex(t=>t.id===id);if(i>=0){it.splice(i,1);save(k);return}}}
function monthStats(ym,wallet='all'){
  const items=(S.docs['tx-'+ym]||{items:[]}).items.filter(t=>t.type!=='move'&&(wallet==='all'||t.wallet===wallet));
  let i=0,o=0;const by={};
  for(const t of items){if(t.type==='in')i+=num(t.amt);else{o+=num(t.amt);by[t.cat]=(by[t.cat]||0)+num(t.amt)}}
  return{i,o,net:i-o,by,items};
}
function balanceAt(wid,date){
  const w=wallets().find(x=>x.id===wid);let b=num(w&&w.open);
  for(const t of allTx()){if(t.date>date)continue;const a=num(t.amt);
    if(t.type==='in'&&t.wallet===wid)b+=a;else if(t.type==='out'&&t.wallet===wid)b-=a;
    else if(t.type==='move'){if(t.wallet===wid)b-=a;if(t.to===wid)b+=a}}
  return b;
}

function bubblesHTML(by){
  const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(!arr.length)return `<div class="empty"><i>🫧</i>ยังไม่มีรายจ่ายเดือนนี้</div>`;
  const max=arr[0][1];
  return `<div class="bubbles">${arr.map(([c,v],k)=>{const s=Math.round(58+84*Math.sqrt(v/max));const col=BUBC[k%BUBC.length];
    return `<div class="bub" style="width:${s}px;height:${s}px;background:color-mix(in srgb,${col} 30%,var(--card));font-size:${s>100?13:11}px"><div><i>${CAT[c]?.i||'📦'}</i>${esc(CAT[c]?.n||c)}<br><b>${fmt(v,0)}</b></div></div>`}).join('')}</div>`;
}
function txRow(t){
  const c=CAT[t.cat]||CAT.other;const sign=t.type==='in'?'+':t.type==='out'?'−':'';
  const sub=t.type==='move'?`${wName(t.wallet)} → ${wName(t.to)}`:`${wIcon(t.wallet)} ${wName(t.wallet)}${t.note?' · '+t.note:''}`;

}

function vcCalc(){
  const V=ST.VC;const use=num(V.use),shelf=num(V.shelf);
  return V.items.map(it=>{
    const u=UNITS[it.unit]||UNITS.g;const total=num(it.size)*u[2]*(num(it.qty)||1);const price=num(it.price);
    if(!total||!price)return{ok:false,it};
    const per=price/total;let usable=total,days=null,waste=0;
    if(V.food&&use>0){days=total/use;if(shelf>0&&days>shelf){usable=use*shelf;waste=total-usable}}
    return{ok:true,it,base:u[1],total,price,per,eff:price/usable,days,waste,wasteBaht:waste*per};
  });
}
function perLabel(r){if(r.base==='pc')return `${fmt(r.per)} บาท/ชิ้น`;return `${fmt(r.per*100)} บาท ต่อ 100 ${BASE[r.base]}`}

/* ----- debt ----- */
function lcCalc(){
  const L=ST.LC;const P=num(L.principal),dd=num(L.deduct),ins=num(L.inst),n=num(L.n),f=num(L.freq)||1;
  const rec=P-dd,paid=ins*n,cost=paid-rec,days=n*f;
  if(!(rec>0&&paid>0&&days>0))return null;
  const pct=cost/rec*100,yr=pct*365/days;
  const legal=rec*0.15*days/365;
  const saveDays=Math.ceil(rec/ins);
  return{P,dd,rec,paid,cost,days,pct,yr,legal,saveDays,ins,f};
}
function lcOut(){
  const el=$('#lcout');if(!el)return;const r=lcCalc();
  if(!r){el.innerHTML=`<div class="res hint">กรอกตัวเลขให้ครบ</div>`;return}
  const per=r.f===1?'วัน':r.f===7?'สัปดาห์':'เดือน';
  const level=r.yr>100?['bad','โหดมาก'] : r.yr>36?['bad','แพงเกินไป'] : r.yr>15?['sky','สูงกว่าเพดานทั่วไป']:['good','อยู่ในเกณฑ์'];
  el.innerHTML=`<div class="res ${r.yr>36?'warn':''} stack">
    <div class="between"><span class="pill ${level[0]}">${level[1]}</span><span class="hint">${r.days} วัน</span></div>
    <table class="tbl"><tr><td>ขอยืม</td><td>${baht(r.P)}</td></tr><tr><td>ถูกหักไปตั้งแต่วันแรก</td><td class="out">−${baht(r.dd)}</td></tr><tr><td>ได้เงินจริงในมือ</td><td><b>${baht(r.rec)}</b></td></tr><tr><td>ต้องจ่ายคืนทั้งหมด</td><td>${baht(r.paid)}</td></tr><tr><td><b>ค่าดอกที่เสียจริง</b></td><td class="out"><b>${baht(r.cost)}</b></td></tr></table>
    <div>คิดเป็น <b>${fmt(r.pct,1)}%</b> ภายใน ${r.days} วัน หรือประมาณ <b class="out">${fmt(r.yr,0)}% ต่อปี</b></div>
    <div class="hint">เทียบเพดานดอกเบี้ยทั่วไปตามกฎหมายแพ่ง 15% ต่อปี ระยะเวลาเท่ากันจะเสียแค่ราว ${baht(r.legal)} · ส่วนที่จ่ายเกินคือ ${baht(r.cost-r.legal)}</div>
  </div>
  <div class="note"><b>ลองคิดกลับด้าน:</b> ถ้าเก็บ${per}ละ ${fmt(r.ins,0)} บาท (เท่าค่างวด) ไว้ก่อน ${r.saveDays} ${per} ก็ได้ ${fmt(r.rec,0)} บาทเท่ากัน โดยไม่เสียดอกเลย</div>`;
}
function payoffSim(list,extra){
  const ds=list.map(d=>({name:d.name,b:num(d.balance),r:num(d.rate)/1200,m:num(d.monthly),done:0}));
  let month=0,interest=0;const order=[];
  while(ds.some(d=>d.b>0.5)&&month<600){
    month++;let pool=num(extra);
    for(const d of ds){if(d.b<=0.5){pool+=d.m;continue}const i=d.b*d.r;interest+=i;d.b+=i}
    for(const d of ds){if(d.b<=0.5)continue;const p=Math.min(d.m,d.b);d.b-=p;pool+=d.m-p}
    for(const d of ds.filter(d=>d.b>0.5).sort((a,b)=>b.r-a.r||a.b-b.b)){if(pool<=0)break;const p=Math.min(pool,d.b);d.b-=p;pool-=p}
    for(const d of ds)if(d.b<=0.5&&!d.done){d.done=month;order.push([d.name,month])}
  }
  return{month,interest,order,stuck:ds.some(d=>d.b>0.5)};
}

/* ----- readiness & report ----- */
function readiness(){
  const main=settings().main;const cur=ymOf(today());
  const months=[];for(let i=6;i>=1;i--)months.push(shiftYM(cur,-i));
  const tx=allTx();
  const inMain=m=>tx.filter(t=>t.type==='in'&&t.cat!=='loan'&&t.wallet===main&&ymOf(t.date)===m).reduce((s,t)=>s+num(t.amt),0);
  const inAll=m=>tx.filter(t=>t.type==='in'&&t.cat!=='loan'&&ymOf(t.date)===m).reduce((s,t)=>s+num(t.amt),0);
  const outAll=m=>tx.filter(t=>t.type==='out'&&t.cat!=='save'&&ymOf(t.date)===m).reduce((s,t)=>s+num(t.amt),0);
  const im=months.map(inMain),ia=months.map(inAll),oa=months.map(outAll);
  const dataMonths=months.filter((m,i)=>ia[i]>0||oa[i]>0).length;
  const f1=im.filter(v=>v>0).length/6*25;
  const mean=im.reduce((s,v)=>s+v,0)/6;
  const sd=Math.sqrt(im.reduce((s,v)=>s+(v-mean)**2,0)/6);
  const f2=mean>0?25*Math.max(0,1-sd/mean):0;
  const TI=ia.reduce((s,v)=>s+v,0),TO=oa.reduce((s,v)=>s+v,0);
  const ratio=TI>0?(TI-TO)/TI:0;const f3=clamp(ratio/0.2,0,1)*25;
  const debtM=D('debts').list.reduce((s,d)=>s+num(d.monthly),0);const avgIn=TI/6;
  const dsr=avgIn>0?debtM/avgIn:(debtM>0?1:0);const f4=dataMonths===0?0:dsr<=0.3?25:dsr>=0.7?0:25*(0.7-dsr)/0.4;
  const score=Math.round(f1+f2+f3+f4);
  const curIn=inMain(cur);
  const weeks=new Set(tx.filter(t=>t.type==='in'&&t.cat!=='loan'&&t.wallet===main&&ymOf(t.date)===cur).map(t=>Math.min(4,Math.ceil(+t.date.slice(8)/7))));
  const tips=[];
  if(dataMonths<3)tips.push(['🐣',`ตอนนี้มีข้อมูล ${dataMonths} จาก 6 เดือน บันทึกต่อเนื่องไปเรื่อยๆ คะแนนจะแม่นขึ้น`]);
  if(mean>0&&curIn<mean)tips.push(['📥',`เดือนนี้เงินเข้า${wName(main)}แล้ว ${fmt(curIn,0)} บาท ยังน้อยกว่าค่าเฉลี่ย ${fmt(mean,0)} บาท ถ้ามีรายได้เงินสดจากงานหรือไลฟ์ นำฝากเข้าบัญชีนี้ก่อนสิ้นเดือน`]);
  if(weeks.size<4)tips.push(['🗓️',`เดือนนี้มีเงินเข้าบัญชีหลัก ${weeks.size} จาก 4 สัปดาห์ ฝากเป็นประจำทุกสัปดาห์จะดูมีรายได้สม่ำเสมอ`]);
  if(f1<25)tips.push(['🏦',`ใน 6 เดือนที่ผ่านมา มี ${6-im.filter(v=>v>0).length} เดือนที่ไม่มีเงินเข้าบัญชีหลัก ให้รายได้ทุกทางเข้าบัญชีเดียวกัน`]);
  if(ratio<0.1&&TI>0)tips.push(['🐷',`เหลือเก็บ ${fmt(ratio*100,0)}% ของรายรับ ลองตั้งเป้า 10–20% และไม่ถอนออกหมดทันทีหลังเงินเข้า`]);
  if(dsr>0.4)tips.push(['📆',`ภาระผ่อนต่อเดือนคิดเป็น ${fmt(dsr*100,0)}% ของรายได้ ลองปิดหนี้ดอกแพงก่อนยื่นกู้`]);
  tips.push(['⚠️','อย่าโอนเงินวนเข้าออกเพื่อให้ยอดดูเยอะ ธนาคารดูออกและอาจปฏิเสธได้ เงินเข้าจริงอย่างสม่ำเสมอดีที่สุด']);
  if(score>=70)tips.unshift(['🌟','เดินบัญชีได้ดีมาก รักษาแบบนี้ไว้ สู้ๆ ค่ะ!']);
  else if(score>=40)tips.unshift(['💪','มาได้ครึ่งทางแล้ว อีกนิดเดียว ทำต่อเนื่องอีกสักพักนะคะ']);
  return{score,f:[['รายได้เข้าบัญชีหลักทุกเดือน',f1],['รายได้นิ่ง ไม่ขึ้นลงมาก',f2],['มีเงินเหลือเก็บ',f3],['ภาระหนี้ไม่หนัก',f4]],tips,months,im,dataMonths};
}
function gaugeSVG(score){
  const r=48,c=2*Math.PI*r,p=clamp(score,0,100)/100;
  const col=score>=70?'var(--good)':score>=40?'var(--accent)':'var(--bad)';
  return `<svg viewBox="0 0 120 120" role="img" aria-label="คะแนน ${score} จาก 100"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="64" text-anchor="middle" font-family="Mali,sans-serif" font-size="30" font-weight="700" fill="var(--ink)">${score}</text><text x="60" y="84" text-anchor="middle" font-size="11" fill="var(--muted)">จาก 100</text></svg>`;
}

/* ---------- image upload (stored on this phone) ---------- */
async function uploadImage(file){
  try{
    let blob=file;
    try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
      blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.8))||file}catch(e){}
    const id='img-'+uid();
    if(!S.idb){toast('แนบรูปไม่ได้ในเบราว์เซอร์นี้');return null}
    await IDB.put('blobs',id,blob);toast('แนบรูปแล้ว');return id;
  }catch(e){toast('แนบรูปไม่สำเร็จ ลองอีกครั้ง');return null}
}

/* ---------- export ---------- */
function saveFile(name,data,type){
  const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast('ดาวน์โหลดแล้ว ดูได้ในโฟลเดอร์ดาวน์โหลด');
}
function printHTML(html){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;right:0;bottom:0';document.body.appendChild(f);
  f.onload=()=>{setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('สั่งพิมพ์ไม่ได้ ลองดาวน์โหลดรายงานแทน')}setTimeout(()=>f.remove(),60000)},300)};
  f.srcdoc=html;
}
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function reportHTML(m){

  <h1>รายงานรายรับ–รายจ่าย ประจำเดือน${mTH(m)}</h1><p class="muted">จัดทำจากแอปกระปุกเจี๊ยบ · พิมพ์เมื่อ ${dTH(today())}</p>
  <table><tr><th>รายรับรวม</th><th>รายจ่ายรวม</th><th>คงเหลือสุทธิ</th></tr><tr><td class="r">${fmt(st.i)}</td><td class="r">${fmt(st.o)}</td><td class="r">${fmt(st.net)}</td></tr></table>
  <h3>ยอดคงเหลือแต่ละกระเป๋า ณ ${dTH(end)}</h3><table>${wallets().map(w=>`<tr><td>${esc(w.name)}</td><td class="r">${fmt(balanceAt(w.id,end))}</td></tr>`).join('')}</table>
  <h3>รายการทั้งหมด</h3><table><tr><th>วันที่</th><th>หมวด</th><th>กระเป๋า</th><th>รายละเอียด</th><th>รายรับ</th><th>รายจ่าย</th></tr>${rows}<tr class="sum"><td colspan="4">รวม</td><td class="r">${fmt(st.i)}</td><td class="r">${fmt(st.o)}</td></tr></table>

    <button class="btn danger full" data-act="resetGo">ล้างข้อมูลที่เลือก</button>`))},
  resetGo:async()=>{
    if(($('#rsConfirm').value||'').trim()!=='ล้างข้อมูล'){toast('พิมพ์คำว่า “ล้างข้อมูล” ให้ตรงก่อนนะคะ');$('#rsConfirm').focus();return}
    const pick={tx:$('#rsTx').checked,people:$('#rsPeople').checked,save:$('#rsSave').checked,debt:$('#rsDebt').checked,wallet:$('#rsWallet').checked};
    if(!Object.values(pick).some(Boolean)){toast('ยังไม่ได้เลือกอะไรเลย');return}
    await ACT.exportJSON();
    const keys=Object.keys(S.docs);
    if(pick.tx){for(const k of keys)if(k.startsWith('tx-')){S.docs[k]={items:[]};save(k)}S.docs.recon={m:{}};save('recon')}
    if(pick.people){S.docs.people={list:[]};save('people');for(const k of keys)if(k.startsWith('pay-')){S.docs[k]={entries:[],payments:[]};save(k)}ST.open={}}
    if(pick.save){S.docs.savings={goals:[]};save('savings')}
    if(pick.debt){S.docs.debts={list:[]};save('debts')}
    if(pick.wallet){const st=settings();st.wallets=structuredClone(DEF.settings.wallets);st.main='bank';save('settings')}
    if(Object.values(pick).every(Boolean)&&S.idb){try{await IDB.clear('blobs')}catch(e){}for(const k in BLOBURL){URL.revokeObjectURL(BLOBURL[k]);delete BLOBURL[k]}S.docs.slips={map:{}};save('slips')}
    closeSheet();location.hash='#home';render();toast('ล้างข้อมูลเรียบร้อย เริ่มต้นใหม่ได้เลย');
  },
  walletAdd:()=>{settings().wallets.push({id:uid(),name:'กระเป๋าใหม่',icon:'💳',open:0});save('settings');render()},
  walletSave:()=>{const s=settings();s.wallets.forEach((w,i)=>{w.name=($('#wn'+i).value||w.name).trim();w.open=num($('#wo'+i).value)});const r=document.querySelector('input[name=mainw]:checked');if(r)s.main=r.value;save('settings');render();toast('บันทึกแล้ว')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){if(t.tagName==='BUTTON'||t.tagName==='A')e.preventDefault();f(t,e)}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind){setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);const l=el.dataset.live;
  if(l==='vc')vcOut();else if(l==='vcAll')render();else if(l==='lc')lcOut();else if(l==='dx')dxOut();else if(l==='gf'){const a=goalAmounts(GF);$('#gfout').innerHTML=`รวมเมื่อครบ <b>${fmt(a.reduce((s,v)=>s+v,0),0)} บาท</b>`}}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.bind&&(el.tagName==='SELECT'||el.type==='checkbox')){setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);if(el.dataset.live==='vcAll')render();else if(el.dataset.live==='vc')vcOut();else if(el.dataset.live==='lc')lcOut()}
  if(el.id==='rpM'&&el.value){ST.RP=el.value;render()}
  if(el.id==='atSlip'&&el.files[0]){const id=await uploadImage(el.files[0]);if(id){AT.slip=id;atRender()}}
  if(el.id==='pfSlip'&&el.files[0]){const id=await uploadImage(el.files[0]);if(id){PF.slip=id;payRender()}}
  if(el.id==='importFile'&&el.files[0]){try{const j=JSON.parse(await el.files[0].text());if(!j||j.app!=='kapook-jeab'||!j.docs)throw 0;ACT._import=j.docs;ACT._importBlobs=j.blobs||{};
    openSheet(sh('นำข้อมูลกลับมา',`<div>ไฟล์สำรองวันที่ ${esc((j.exported||'').slice(0,10))} · ${Object.keys(j.docs).filter(k=>k.startsWith('tx-')).length} เดือนที่มีรายการ</div><div class="note warn">ข้อมูลในแอปตอนนี้จะถูกแทนที่ด้วยข้อมูลในไฟล์ทั้งหมด</div><button class="btn danger full" data-act="importOk">ยืนยันนำข้อมูลกลับมา</button>`))}
    catch(err){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของกระปุกเจี๊ยบ')}el.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(dirty&&$('#sheet').hidden){const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))render()}},300)});

/* ---------- boot ---------- */
setSync();initStore();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e;if(route()==='backup'||route()==='menu')render()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
